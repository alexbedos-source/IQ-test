<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="IQ Lab">
<meta name="theme-color" content="#eef1f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0b16" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>IQ Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: one phone-width column, big tap targets, a ruled answer-sheet feel; results are read against a bell curve. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#121c26; --muted:#5b6975; --line:#d3dae1;
  --accent:#6a3fd1; --accent-ink:#ffffff; --warn:#b4540a; --good:#1c7a4d; --bad:#b3261e;
  --display:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e0b16; --surface:#1a1526; --ink:#ece8f4; --muted:#a39bb5; --line:#2f2742;
    --accent:#b393ff; --accent-ink:#1a0b33; --warn:#f0a15a; --good:#5fd39a; --bad:#ff8a80;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e0b16; --surface:#1a1526; --ink:#ece8f4; --muted:#a39bb5; --line:#2f2742;
  --accent:#b393ff; --accent-ink:#1a0b33; --warn:#f0a15a; --good:#5fd39a; --bad:#ff8a80;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--display);-webkit-text-size-adjust:100%;touch-action:manipulation}
.wrap{max-width:560px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(40px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0}
h1{font-size:1.8rem;font-weight:600}
h2{font-size:1.2rem;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.note{font-size:.88rem;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.stack{display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:14px 20px;font-weight:600;cursor:pointer;min-height:50px;width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{width:auto;padding:10px 16px;min-height:44px}
.btn:focus-visible,.opt:focus-visible,.mode:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.eyebrow{font:500 .78rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kinds{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kind{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.kind b{display:block;font-size:.92rem}
.kind span{font-size:.8rem;color:var(--muted)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mode{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px 8px;cursor:pointer;min-height:96px;justify-content:center}
.mode:active{border-color:var(--accent);background:var(--bg)}
.mode b{font:600 1.6rem var(--mono);color:var(--accent);font-variant-numeric:tabular-nums}
.mode span{font-size:.82rem;color:var(--muted)}
.rules{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px}
.hist{display:flex;flex-direction:column}
.hrow{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:baseline}
.hrow:first-child{border-top:0}
.hrow .d{color:var(--muted);font-size:.9rem}
.hrow .m{font:500 .78rem var(--mono);color:var(--muted)}
.hrow .q{font:600 1.15rem var(--mono);font-variant-numeric:tabular-nums}
.hrow .r{font:400 .82rem var(--mono);color:var(--muted)}

/* test */
.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.timer{font:600 1.7rem var(--mono);font-variant-numeric:tabular-nums}
.timer.low{color:var(--warn)}
.count{font:500 .9rem var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.prompt{font-size:1.1rem;font-weight:500}
.seq{font:600 1.6rem var(--mono);text-align:center;padding:18px 2px;letter-spacing:.03em;overflow-wrap:anywhere}
.opts{display:grid;gap:10px;margin-top:18px}
.opts.two{grid-template-columns:1fr 1fr}
.opts.vis{grid-template-columns:repeat(3,1fr)}
.opts.four{grid-template-columns:repeat(2,1fr)}
.opt{display:flex;align-items:center;gap:10px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;min-height:52px;cursor:pointer;-webkit-user-select:none;user-select:none}
.opt:active{border-color:var(--accent);background:var(--bg)}
.opt .k{font:500 .8rem var(--mono);color:var(--muted);min-width:1.1em}
.opt.num{font:600 1.15rem var(--mono)}
.opt.vis{flex-direction:column;justify-content:center;gap:2px;padding:6px}
.opt.vis svg{width:100%;max-width:92px}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.skip{margin-top:16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.fb{margin-top:16px;display:flex;flex-direction:column;gap:12px}
.fb b.ok{color:var(--good)} .fb b.no{color:var(--bad)}

/* figures */
svg.fig *{stroke:var(--ink);stroke-width:3.5;stroke-linejoin:round}
svg.fig .f0{fill:none}
svg.fig .f1{fill:var(--ink);fill-opacity:.3}
svg.fig .f2{fill:var(--ink)}
svg.fig .poly{fill:var(--ink);stroke:var(--surface);stroke-width:2}
.mx{display:grid;grid-template-columns:repeat(3,1fr);max-width:264px;margin:16px auto 0;border:1.5px solid var(--line)}
.mx .c{aspect-ratio:1;border:1px solid var(--line);display:grid;place-items:center;padding:6px}
.mx .c svg{width:100%;height:100%}
.mx .q{font:600 2rem var(--mono);color:var(--accent)}
.target{display:grid;place-items:center;margin:14px auto 0;width:132px;padding:6px;border:1.5px solid var(--line);border-radius:10px}
.target svg{width:100%}

/* results */
.big{font:600 4.2rem/1 var(--mono);font-variant-numeric:tabular-nums}
.hero{display:flex;flex-direction:column;gap:8px}
.band{display:inline-block;align-self:flex-start;border:1.5px solid var(--accent);color:var(--accent);border-radius:999px;padding:2px 12px;font-weight:600;font-size:.9rem}
.curve{width:100%;height:auto;display:block}
.curve text{fill:var(--muted);font:500 10px var(--mono)}
.curve .axis{stroke:var(--line);stroke-width:1}
.curve .area{fill:var(--accent);fill-opacity:.18}
.curve .line{fill:none;stroke:var(--ink);stroke-width:1.5}
.curve .pin{stroke:var(--accent);stroke-width:2.5}
.curve .rng{fill:var(--accent);fill-opacity:.35}
.cats{display:flex;flex-direction:column;gap:12px}
.cr{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.cr .n{font-weight:500}
.cr .v{font:500 .9rem var(--mono);font-variant-numeric:tabular-nums}
.cr .t{grid-column:1/-1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.cr .t i{display:block;height:100%;background:var(--accent)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fact{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.fact b{display:block;font:600 1.15rem var(--mono);font-variant-numeric:tabular-nums}
.fact span{font-size:.8rem;color:var(--muted)}
details.rev{border-top:1px solid var(--line);padding:10px 0}
details.rev summary{cursor:pointer;display:flex;gap:10px;align-items:baseline}
details.rev .mark{font:600 .9rem var(--mono);min-width:1.4em}
.ok{color:var(--good)} .no{color:var(--bad)} .sk{color:var(--muted)}
details.rev p{margin-top:6px;font-size:.92rem;color:var(--muted)}
.src li{margin-bottom:6px}
.src a{color:var(--accent)}
/* hub */
.hub{display:flex;flex-direction:column;gap:12px}
.hubcard{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:18px;cursor:pointer}
.hubcard:active{border-color:var(--accent)}
.hubcard b{font-size:1.25rem}
.hubcard span{color:var(--muted);font-size:.92rem}
/* physics */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.85rem;cursor:pointer;min-height:36px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.facts.four{grid-template-columns:repeat(4,1fr)}
.qrow{display:grid;grid-template-columns:1.4em 1fr auto;gap:10px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 0;cursor:pointer}
.qrow:first-of-type{border-top:0}
.qrow .mark{font:600 .9rem var(--mono)}
.qrow .qt{font-size:.95rem}
.qrow .lv,.lv{font-size:.7rem;color:var(--muted);letter-spacing:1px;white-space:nowrap}
.hint{border-left:3px solid var(--warn);padding:6px 0 6px 12px}
.hint p{margin-top:2px}
.answer{border-left:3px solid var(--good);padding:6px 0 6px 12px;display:flex;flex-direction:column;gap:8px;margin-top:6px}
.answer p{margin:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.row3 .btn{padding:10px 6px;font-size:.9rem}
.rate.ok{border-color:var(--good)} .rate.sk{border-color:var(--warn)} .rate.no{border-color:var(--bad)}
/* working memory */
.mem{font:600 2.2rem var(--mono);text-align:center;letter-spacing:.3em;padding:26px 0 26px .3em;white-space:nowrap}
.memgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;max-width:200px;margin:18px auto}
.memgrid i{aspect-ratio:1;border:1.5px solid var(--line);border-radius:4px}
.memgrid i.on{background:var(--ink);border-color:var(--ink)}
.opt .memgrid{width:100%;max-width:110px;margin:4px auto;gap:3px}
.opt .memgrid i{border-width:1px}
.opt.seqo{justify-content:center;font:600 1.15rem var(--mono);letter-spacing:.12em}
.memcount{font:500 .9rem var(--mono);color:var(--muted);text-align:center}
/* back arrow */
.tb{position:sticky;top:0;z-index:5;display:none;padding:max(8px,env(safe-area-inset-top)) 12px 6px max(12px,env(safe-area-inset-left));background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#backbtn{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;padding:0}
#backbtn:active{border-color:var(--accent)}
#backbtn svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.tb[style*="flex"]+.wrap{padding-top:4px}
/* hub sections */
.hubsec{display:flex;flex-direction:column;gap:10px}
.hubgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hubgrid .hubcard{padding:14px;min-height:96px}
.hubgrid .hubcard b{font-size:1.02rem}
.hubgrid .hubcard span{font-size:.8rem}
.badge{align-self:flex-start;font:600 .72rem var(--mono);color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:1px 8px;margin-top:4px}
.badge.done{color:var(--good);border-color:var(--good)}
/* shared bits */
details.fu{border-top:1px solid var(--line);padding:10px 0 2px}
details.fu summary{cursor:pointer;font-weight:500}
details.fu p,details.fu .answer{margin-top:8px;color:var(--ink)}
.tog{display:flex;gap:10px;align-items:center;font-weight:500}
.tog input{width:22px;height:22px;accent-color:var(--accent)}
.ivbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:-6px}
.recdot{font:600 .8rem var(--mono);color:var(--bad);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.35}}
.crit{display:flex;flex-direction:column;gap:6px}
.stars{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.stars button{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;min-height:40px;font:600 .95rem var(--mono);cursor:pointer}
.stars button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
textarea{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px;width:100%;resize:vertical}
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.days i{aspect-ratio:1;border-radius:4px;background:var(--line)}
.days i.on{background:var(--accent)}
.days i.today{outline:2px solid var(--ink);outline-offset:1px}
.plot{width:100%;max-width:320px;display:block;margin:12px auto 0;background:var(--bg);border-radius:8px}
.plot .ax{stroke:var(--muted);stroke-width:1}
.plot .cv{fill:none;stroke:var(--accent);stroke-width:2.5}
.plot text{fill:var(--muted);font:500 10px var(--mono)}
.mathx{font-family:var(--mono);font-weight:600}
sup,sub{font-size:.72em;line-height:0}
/* answer review */
.rv{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:6px}
.rv:first-of-type{border-top:0}
.rv .rq{font-weight:500}
.rv .ra{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:.92rem;align-items:baseline}
.rv .ra .lab{font:500 .78rem var(--mono);color:var(--muted);text-transform:uppercase}
.rv .ra svg{max-width:84px;vertical-align:middle}
.rv .ra .mx{max-width:180px;margin:0}
.rv .plot{max-width:240px;margin:4px 0}
.rv .why{font-size:.9rem;color:var(--muted)}
.rv .mxwrap{transform-origin:left top}
/* video links */
.vlinks{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.vbtn{border:1.5px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:6px 12px;font:600 .85rem var(--display);cursor:pointer}
.vyt{font-size:.85rem;color:var(--muted)}
/* video player */
#vplayer{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;padding:max(14px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;max-width:560px;margin:0 auto}
body.vp-open{overflow:hidden}
.vp-top{display:flex;justify-content:space-between;align-items:center}
.vp-x{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-size:1rem;cursor:pointer}
.vp-dots{display:flex;gap:6px}
.vp-dots i{flex:1;height:5px;border-radius:3px;background:var(--line);cursor:pointer}
.vp-dots i.on{background:var(--accent)}
.vp-stage{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-height:260px;display:flex;flex-direction:column;gap:12px;justify-content:center}
.vp-show{animation:vpin .45s ease}
@keyframes vpin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.vp-show{animation:none}}
.vp-cap{font-size:1rem;line-height:1.55;color:var(--ink);min-height:4.6em}
.vp-ctl{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.vp-ctl button{min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:1.3rem;cursor:pointer}
.vp-ctl .vp-play{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.v-eq p{font:600 1.15rem var(--mono);text-align:center;margin:8px 0;overflow-wrap:anywhere}
.v-li{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:10px;font-size:1.02rem}
.v-gr .plot{max-width:300px}
.v-gr .note{text-align:center}
.v-dg{width:100%;max-width:300px;display:block;margin:0 auto}
.v-dg .ax{stroke:var(--muted);stroke-width:.8}
.v-dg .c1{stroke:var(--accent);stroke-width:1.6}.v-dg .c2{stroke:var(--good);stroke-width:1.6}.v-dg .c3{stroke:var(--bad);stroke-width:1.6}
.v-dg text{fill:var(--muted);font:500 4.2px var(--mono)}.v-dg .lb{fill:var(--ink)}
.v-dg .dot{fill:var(--ink)}.v-dg .area{fill:var(--bad);fill-opacity:.25}
.v-end{display:flex;flex-direction:column;gap:12px;text-align:center}
/* scratchpad */
#scratchbtn{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));z-index:15;width:54px;height:54px;border-radius:50%;border:0;background:var(--accent);box-shadow:0 4px 14px rgba(0,0,0,.25);display:none;place-items:center;cursor:pointer}
#scratchbtn.show{display:grid}
#scratchbtn svg{width:26px;height:26px;fill:none;stroke:var(--accent-ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
body.sp-open #scratchbtn,body.vp-open #scratchbtn{display:none}
#scratch{position:fixed;inset:0;z-index:25;display:none;flex-direction:column;background:var(--surface)}
#scratch.open{display:flex}
#scratch.over{background:transparent}
#scratch.over .sp-bar{background:var(--surface)}
#scratch canvas{flex:1;width:100%;touch-action:none;display:block;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px}
#scratch.over canvas{background-image:none}
.sp-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:max(10px,env(safe-area-inset-top)) 10px 10px;border-bottom:1px solid var(--line)}
.sp-bar button{min-height:40px;min-width:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 .9rem var(--display);padding:0 10px;cursor:pointer}
.sp-bar button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 15%,var(--surface))}
.sp-cols{display:flex;gap:4px}
.sp-cols button{padding:0;min-width:36px}
.sp-cols i{display:block;width:18px;height:18px;border-radius:50%;margin:auto}
.sp-cols [data-c="ink"] i{background:var(--ink)}.sp-cols [data-c="accent"] i{background:var(--accent)}.sp-cols [data-c="bad"] i{background:var(--bad)}
.sp-bar .sp-close{margin-left:auto;background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.flash{min-height:180px;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center}
.flash .prompt{font-size:1.25rem}
.cardback p{font:600 1.15rem var(--mono);color:var(--accent)}
.lesson p{margin:0}
.res{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink);border-top:1px solid var(--line);padding:10px 0}
.res:first-of-type{border-top:0}
.res b{color:var(--accent)}
.res span{font-size:.88rem;color:var(--muted)}
.center{text-align:center}
.sym{font-size:2rem;text-align:center;letter-spacing:.15em;padding:4px 0}
.sym.tgt{color:var(--accent)}
.big2{min-height:72px;font-size:1.2rem}
.spark{width:100%;height:auto}
.spark polyline{fill:none;stroke:var(--accent);stroke-width:2}
.spark circle{fill:var(--accent)}
.spark text{fill:var(--muted);font:500 10px var(--mono)}
.t1{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.t1 i{display:block;height:100%;background:var(--accent)}
@media (max-width:380px){ .big{font-size:3.4rem} .facts{grid-template-columns:1fr 1fr} }
@media (prefers-reduced-motion:reduce){ .bar i{transition:none} }
</style>
</head>
<body>
<script>
/* Start-up safety net: if anything fails while the app loads (for example a stale cached file after an update),
   clear the offline cache and reload once automatically. If it still fails, show a repair button.
   Progress (localStorage) is never touched. */
window.IQ_V='11';
(function(){
  let started=false;window.addEventListener('iq-started',()=>{started=true;});
  async function repair(){
    try{if(navigator.serviceWorker){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()));}}catch(e){}
    try{if(window.caches){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));}}catch(e){}
    location.reload();
  }
  window.iqRepair=repair;
  function fail(msg){
    if(started)return;
    /* never wipe the offline copy while offline: that is the only copy available */
    if(navigator.onLine!==false&&!sessionStorage.getItem('iq-repaired')){sessionStorage.setItem('iq-repaired','1');repair();return;}
    const show=()=>{const a=document.getElementById('app');if(!a)return setTimeout(show,50);
      a.innerHTML='<div class="stack" style="padding-top:40px"><h1>IQ Lab didn\'t load properly</h1><p class="muted">This can happen just after an update. Your progress is safe: repairing only clears the app\'s offline copy.</p><button class="btn" onclick="sessionStorage.removeItem(\'iq-repaired\');iqRepair()">Repair and reload</button><p class="note">Details: '+String(msg).replace(/</g,'&lt;')+'</p></div>';};
    show();
  }
  /* only script problems count: a missing font or image must not trigger a repair */
  window.addEventListener('error',e=>{
    const t=e.target;
    if(t&&t!==window&&t.tagName!=='SCRIPT')return;
    fail(e.message||('could not load '+((t&&t.src)||'a script')));
  },true);
  window.addEventListener('unhandledrejection',e=>fail(e.reason));
})();
</script>

<script>
/* =====================  helpers  ===================== */
const rnd=n=>Math.floor(Math.random()*n);
const rint=(a,b)=>a+rnd(b-a+1);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const LETTERS='ABCDEF';

/* =====================  figures  ===================== */
const LAYOUT={1:[[50,50]],2:[[30,50],[70,50]],3:[[50,28],[30,68],[70,68]],4:[[30,30],[70,30],[30,70],[70,70]]};
const RAD={1:26,2:17,3:14,4:14};
const SH=['circle','square','triangle'];
const SHN=['circle','square','triangle'], FILLN=['empty','lightly shaded','solid'];
function shp(t,x,y,r,f){
  const c='class="f'+f+'"';
  if(t==='circle') return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" '+c+'/>';
  if(t==='square'){const s=r*.9;return '<rect x="'+(x-s)+'" y="'+(y-s)+'" width="'+(2*s)+'" height="'+(2*s)+'" '+c+'/>';}
  const p=[[x,y-r],[x+r*.98,y+r*.8],[x-r*.98,y+r*.8]].map(q=>q.join(',')).join(' ');
  return '<polygon points="'+p+'" '+c+'/>';
}
const wrapSvg=inner=>'<svg class="fig" viewBox="0 0 100 100" aria-hidden="true">'+inner+'</svg>';
const cellSvg=c=>wrapSvg(LAYOUT[c.n].map(([x,y])=>shp(SH[c.s],x,y,RAD[c.n],c.f)).join(''));
const GLYPH={
  arrow:'50,10 74,42 59,42 59,90 41,90 41,42 26,42',
  L:'28,12 48,12 48,68 74,68 74,88 28,88',
  flag:'34,10 76,32 48,50 48,90 34,90',
  hook:'30,12 70,12 70,50 52,50 52,88 30,88'
};
const glyphSvg=(g,a,mir)=>wrapSvg('<g transform="rotate('+a+' 50 50)'+(mir?' translate(100 0) scale(-1 1)':'')+'"><polygon points="'+GLYPH[g]+'" class="f2"/></g>');

/* polyomino helpers */
const norm=cs=>{const mx=Math.min(...cs.map(p=>p[0])),my=Math.min(...cs.map(p=>p[1]));return cs.map(([x,y])=>[x-mx,y-my]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);};
const rot90=cs=>norm(cs.map(([x,y])=>[-y,x]));
const mirror=cs=>norm(cs.map(([x,y])=>[-x,y]));
const rotN=(cs,k)=>{let r=norm(cs);for(let i=0;i<k;i++)r=rot90(r);return r;};
const pkey=cs=>JSON.stringify(norm(cs));
const chiral=cs=>[0,1,2,3].every(k=>pkey(mirror(cs))!==pkey(rotN(cs,k)));
const rotsym=cs=>[1,2,3].some(k=>pkey(rotN(cs,k))===pkey(cs));
function polySvg(cs){
  const w=Math.max(...cs.map(p=>p[0]))+1,h=Math.max(...cs.map(p=>p[1]))+1,m=Math.max(w,h);
  const u=Math.min(26,92/m),ox=(100-w*u)/2,oy=(100-h*u)/2;
  return wrapSvg(cs.map(([x,y])=>'<rect class="poly" x="'+(ox+x*u)+'" y="'+(oy+y*u)+'" width="'+u+'" height="'+u+'"/>').join(''));
}

/* generic item builder: first option in `right` is correct */
function build(o){
  const opts=[{html:o.right,ok:true}].concat(o.wrong.map(h=>({html:h,ok:false})));
  return {id:o.id,cat:o.cat,b:o.b,vis:!!o.vis,four:!!o.four,num:!!o.num,two:!!o.two,
    prompt:o.prompt,stem:o.stem||'',opts,explain:o.explain,c:1/opts.length};
}

/* =====================  1. number and letter series  ===================== */
const FAMS=[];
const fam=(lo,hi,fn)=>FAMS.push({lo,hi,fn});
fam(0,.3,()=>{const a=rint(2,15),d=rint(2,9),dec=Math.random()<.3;const s=dec?a+d*6:a,dd=dec?-d:d;
  const t=[0,1,2,3,4].map(i=>s+dd*i);return {t,ans:s+dd*5,ex:'Each term '+(dec?'subtracts ':'adds ')+d+', so the next is '+(s+dd*5)+'.'};});
fam(.1,.4,()=>{const a=rint(1,5),r=pick([2,3]);const t=[0,1,2,3,4].map(i=>a*Math.pow(r,i));
  return {t,ans:a*Math.pow(r,5),ex:'Each term is multiplied by '+r+'. '+t[4]+' × '+r+' = '+a*Math.pow(r,5)+'.'};});
fam(.2,.45,()=>{const s=rint(1,8);const t=[0,1,2,3,4].map(i=>(s+i)*(s+i));
  return {t,ans:(s+5)*(s+5),ex:'These are square numbers ('+s+'², '+(s+1)+'², …). The next is '+(s+5)+'² = '+(s+5)*(s+5)+'.'};});
fam(.3,.55,()=>{const a=rint(1,10),g=rint(1,4),h=pick([1,2]);const t=[a];let gap=g;
  for(let i=0;i<5;i++){t.push(t[t.length-1]+gap);gap+=h;}
  return {t,ans:t[5]+gap,ex:'The gaps grow by '+h+' each time ('+g+', '+(g+h)+', '+(g+2*h)+', …), so the next gap is '+gap+'. '+t[5]+' + '+gap+' = '+(t[5]+gap)+'.'};});
fam(.4,.7,()=>{const a1=rint(1,12),d1=rint(2,7),a2=rint(20,40),d2=rint(2,6);
  const t=[a1,a2,a1+d1,a2+d2,a1+2*d1,a2+2*d2];
  return {t,ans:a1+3*d1,ex:'Two sequences are interleaved. Positions 1, 3, 5 go up by '+d1+'; positions 2, 4, 6 go up by '+d2+'. The next is '+(a1+3*d1)+'.'};});
fam(.5,.75,()=>{const x=rint(1,4),k=rint(1,5);const q=[0,1,2,3,4,5].map(i=>x*i*i+k);
  return {t:q.slice(0,5),ans:q[5],ex:'The terms follow '+(x===1?'':x+' × ')+'n² + '+k+', counting n from 0. For n = 5 that gives '+q[5]+'.'};});
fam(.5,.8,()=>{const a=rint(1,9),g=rint(1,3);const t=[a,a+g,a+3*g,a+7*g,a+15*g];
  return {t,ans:a+31*g,ex:'The gaps double: +'+g+', +'+2*g+', +'+4*g+', +'+8*g+', so the next gap is +'+16*g+'. '+t[4]+' + '+16*g+' = '+(a+31*g)+'.'};});
fam(.55,.8,()=>{const a1=rint(1,5),a2=rint(5,15),d=rint(3,8);
  const t=[a1,a2,a1*2,a2+d,a1*4,a2+2*d];
  return {t,ans:a1*8,ex:'Two sequences are interleaved. Positions 1, 3, 5 double ('+a1+', '+a1*2+', '+a1*4+'); positions 2, 4, 6 go up by '+d+'. The next is '+a1*8+'.'};});
fam(.6,.85,()=>{let m,c,x1,t;do{m=pick([2,3]);c=pick([-1,1,2]);x1=rint(1,4);t=[x1];
  for(let i=0;i<5;i++)t.push(m*t[t.length-1]+c);}while(t[1]<=t[0]);
  return {t:t.slice(0,5),ans:t[5],ex:'Each term is '+m+' × the previous term '+(c>0?'plus ':'minus ')+Math.abs(c)+'. '+t[4]+' × '+m+(c>0?' + ':' − ')+Math.abs(c)+' = '+t[5]+'.'};});
fam(.65,.9,()=>{const a=rint(2,6),s=rint(2,5);const t=[s];
  for(let i=0;i<5;i++){if(i%2===0){t.push(t[t.length-1]+a);}else{t.push(t[t.length-1]*2);}}
  return {t,ans:t[5]*2,ex:'The rule alternates: add '+a+', then double. After adding '+a+' to reach '+t[5]+', the next step is to double: '+t[5]*2+'.'};});
fam(.75,1,()=>{const a=rint(1,8),f=pick([[1,2],[2,3],[1,1],[2,2]]);const g=[f[0],f[1]];
  for(let i=0;i<4;i++)g.push(g[g.length-1]+g[g.length-2]);
  const t=[a];for(let i=0;i<5;i++)t.push(t[t.length-1]+g[i]);
  return {t,ans:t[5]+g[5],ex:'The gaps are '+g.slice(0,5).join(', ')+', each the sum of the two before. The next gap is '+g[5]+'. '+t[5]+' + '+g[5]+' = '+(t[5]+g[5])+'.'};});
fam(.8,1,()=>{let a=rint(1,5),b=rint(a+1,7);const t=[a,b];
  for(let i=0;i<5;i++)t.push(t[t.length-1]+t[t.length-2]);
  return {t:t.slice(0,6),ans:t[6],ex:'Each term is the sum of the two before it. '+t[4]+' + '+t[5]+' = '+t[6]+'.'};});
fam(.45,.75,()=>{const s=rint(1,3);const t=[0,1,2,3,4].map(i=>(i+s)*(i+s+1)/2);
  return {t,ans:(5+s)*(6+s)/2,ex:'These are triangular numbers (each adds one more than the last gap). The next is '+(5+s)*(6+s)/2+'.'};});
const A='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const letterFams=[
 {lo:0,hi:.35,fn:()=>{const st=rint(0,8),d=rint(2,3);const t=[0,1,2,3,4].map(i=>st+d*i);
   return {t,ans:st+d*5,ex:'Each letter moves forward '+d+' places in the alphabet.'};}},
 {lo:.35,hi:.7,fn:()=>{const st=rint(0,3);const t=[st];let g=1;for(let i=0;i<4;i++){t.push(t[t.length-1]+g);g++;}
   return {t,ans:t[4]+5,ex:'The jumps grow by one each time (1, 2, 3, 4), so the next jump is 5.'};}},
 {lo:.55,hi:.9,fn:()=>{const a=rint(0,5),b=rint(19,25);const t=[a,b,a+2,b-2,a+4,b-4];
   return {t,ans:a+6,ex:'Two sequences are interleaved: odd positions move forward 2, even positions move back 2. The next letter is '+A[a+6]+'.'};}}
];
function genSeries(L){
  const isLetter=Math.random()<.25;
  const pool=(isLetter?letterFams:FAMS).filter(f=>L>=f.lo-.001&&L<=f.hi+.001);
  const f=(pool.length?pick(pool):pick(isLetter?letterFams:FAMS));
  const g=f.fn();
  const b=clamp(-1.9+3.8*L,-1.9,1.9);
  let shown,right,wrong;
  if(isLetter){
    shown=g.t.map(i=>A[i]);right=A[g.ans];
    const c=shuffle([g.ans+1,g.ans-1,g.ans+2,g.ans-2,g.ans+3].filter(i=>i>=0&&i<26&&i!==g.ans)).slice(0,3);
    wrong=c.map(i=>A[i]);
  }else{
    shown=g.t;right=String(g.ans);
    const last=g.t[g.t.length-1],prev=g.t[g.t.length-2],gap=last-prev;
    let c=[g.ans+1,g.ans-1,g.ans+2,g.ans-2,last+gap,g.ans+(g.ans-last),g.ans-(g.ans-last)];
    c=[...new Set(c.filter(v=>Number.isInteger(v)&&v>0&&v!==g.ans))];
    shuffle(c);c=c.slice(0,3);
    while(c.length<3){const v=g.ans+pick([-1,1])*rint(3,7);if(v>0&&v!==g.ans&&!c.includes(v))c.push(v);}
    wrong=c.map(String);
  }
  return build({id:'S',cat:0,b,num:true,two:true,
    prompt:isLetter?'Which letter comes next?':'What number comes next?',
    stem:'<div class="seq">'+shown.join(', ')+', ?</div>',right,wrong,explain:g.ex});
}

/* =====================  2. matrices  ===================== */
const SUMROWS=[[1,1,2],[1,2,3],[2,1,3],[1,3,4],[3,1,4],[2,2,4]];
const DIFFROWS=[[3,1,2],[2,1,1],[4,1,3],[4,2,2],[3,2,1],[4,3,1]];
function symRule(rule){
  if(rule==='const'){const v=rnd(3);return {f:()=>v,w:0,tx:null};}
  if(rule==='rowC'){const p=shuffle([0,1,2]);return {f:(r)=>p[r],w:.4,tx:'rowC'};}
  if(rule==='colC'){const p=shuffle([0,1,2]);return {f:(r,c)=>p[c],w:.4,tx:'colC'};}
  const p=shuffle([0,1,2]),d=pick([1,2]);return {f:(r,c)=>p[(c+d*r)%3],w:1.0,tx:'dist3'};
}
function cntRule(rule){
  if(rule==='const'){const v=pick([1,2,3]);return {f:()=>v,w:0,tx:null};}
  if(rule==='rowC'){const p=shuffle([1,2,3,4]).slice(0,3);return {f:(r)=>p[r],w:.4,tx:'rowC'};}
  if(rule==='colC'){const p=shuffle([1,2,3,4]).slice(0,3);return {f:(r,c)=>p[c],w:.4,tx:'colC'};}
  if(rule==='prog'){const s=pick([1,2]),ax=pick(['r','c']);return {f:ax==='r'?(r)=>s+r:(r,c)=>s+c,w:.6,tx:ax==='r'?'progR':'progC'};}
  if(rule==='dist3'){const p=shuffle([1,2,3,4]).slice(0,3),d=pick([1,2]);return {f:(r,c)=>p[(c+d*r)%3],w:1.0,tx:'dist3'};}
  if(rule==='sum'){const rows=shuffle(SUMROWS.slice()).slice(0,3);return {f:(r,c)=>rows[r][c],w:1.4,tx:'sum'};}
  const rows=shuffle(DIFFROWS.slice()).slice(0,3);return {f:(r,c)=>rows[r][c],w:1.6,tx:'diff'};
}
/* every rule from a small library that fits the 8 visible cells must predict the same missing value */
function predictions(g,dom){
  const out=new Set(),dv=dom==='sym'?[0,1,2]:[1,2,3,4];
  const fits=fn=>{for(let r=0;r<3;r++)for(let c=0;c<3;c++){if(r===2&&c===2)continue;if(fn(r,c)!==g[r][c])return false;}return true;};
  dv.forEach(v=>{if(fits(()=>v))out.add(v);});
  if(g[0][0]===g[0][1]&&g[0][1]===g[0][2]&&g[1][0]===g[1][1]&&g[1][1]===g[1][2]&&g[2][0]===g[2][1])out.add(g[2][0]);
  if([0,1,2].every(c=>g[0][c]===g[1][c])&&[0,1].every(c=>g[0][c]===g[2][c])&&g[0][2]===g[1][2])out.add(g[0][2]);
  [1,2].forEach(d=>{if(fits((r,c)=>g[0][(c+d*r)%3]))out.add(g[0][(2+2*d)%3]);});
  const s0=[...g[0]].sort().join(),s1=[...g[1]].sort().join();
  if(s0===s1&&g[2][0]!==g[2][1]){const rest=[...g[0]];[g[2][0],g[2][1]].forEach(v=>{const i=rest.indexOf(v);if(i>=0)rest.splice(i,1);else rest.push('x','x');});if(rest.length===1)out.add(rest[0]);}
  if(dom==='cnt'){
    for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++)for(let k=-2;k<=6;k++){if(fits((r,c)=>a*r+b*c+k)){const v=2*a+2*b+k;if(v>=1&&v<=4)out.add(v);}}
    if([0,1].every(r=>g[r][2]===g[r][0]+g[r][1]))out.add(g[2][0]+g[2][1]);
    if([0,1].every(r=>g[r][2]===g[r][0]-g[r][1]))out.add(g[2][0]-g[2][1]);
  }
  return out;
}
const EXPL={
 s:{rowC:'Each row has its own shape.',colC:'Each column has its own shape.',dist3:'The three shapes are spread so each appears once in every row and column.'},
 n:{rowC:'Each row has its own number of shapes.',colC:'Each column has its own number of shapes.',progR:'The number of shapes goes up by one down each column.',progC:'The number of shapes goes up by one across each row.',dist3:'The three counts are spread so each appears once in every row and column.',sum:'In each row the third count is the first plus the second.',diff:'In each row the third count is the first minus the second.'},
 f:{rowC:'Each row has its own shading.',colC:'Each column has its own shading.',dist3:'The three shadings are spread so each appears once in every row and column.'}
};
function genMatrix(L){
  const target=.4+3.2*L;let best=null;
  for(let t=0;t<600;t++){
    const nAct=L<.2?1:L<.5?pick([1,2,2]):L<.8?pick([2,3]):3;
    const act=shuffle(['s','n','f']).slice(0,nAct);
    const R={};let sw=0;
    ['s','n','f'].forEach(k=>{
      const on=act.includes(k);
      R[k]=k==='n'?cntRule(on?pick(['rowC','colC','prog','prog','dist3','sum','diff']):'const'):symRule(on?pick(['rowC','colC','dist3']):'const');
      sw+=R[k].w;
    });
    if(sw<=0||Math.abs(sw-target)>.4)continue;
    const g={s:[],n:[],f:[]};
    for(const k in g){for(let r=0;r<3;r++){g[k].push([]);for(let c=0;c<3;c++)g[k][r].push(R[k].f(r,c));}}
    if(g.n.some(row=>row.some(v=>v<1||v>4)))continue;
    let amb=false;
    for(const k of ['s','n','f']){const p=predictions(g[k],k==='n'?'cnt':'sym');if(p.size!==1||!p.has(g[k][2][2])){amb=true;break;}}
    if(amb)continue;
    best={R,g,sw,act};break;
  }
  if(!best)return genMatrix(Math.max(0,L-.1));
  const {R,g,sw,act}=best;
  const cell=(r,c)=>({s:g.s[r][c],n:g.n[r][c],f:g.f[r][c]});
  const T=cell(2,2),key=x=>x.s+'|'+x.n+'|'+x.f;
  const seen=new Set([key(T)]),wrong=[];
  const add=x=>{if(x.n<1||x.n>4||x.s<0||x.s>2||x.f<0||x.f>2)return;if(seen.has(key(x)))return;seen.add(key(x));wrong.push(x);};
  shuffle([[1,2],[2,1],[1,1],[2,0],[0,2]]).slice(0,5).forEach(([r,c])=>{if(wrong.length<2)add(cell(r,c));});
  const single=[];
  for(let v=0;v<3;v++){single.push({s:v,n:T.n,f:T.f});single.push({s:T.s,n:T.n,f:v});}
  for(let v=1;v<=4;v++)single.push({s:T.s,n:v,f:T.f});
  shuffle(single).forEach(x=>{if(wrong.length<5)add(x);});
  while(wrong.length<5)add({s:rnd(3),n:rint(1,4),f:rnd(3)});
  const names=[];
  act.forEach(k=>names.push(EXPL[k][R[k].tx]));
  const noun=T.n===1?SHN[T.s]:SHN[T.s]+'s';
  const ex=names.join(' ')+' The missing cell is '+(T.n===1?'one ':T.n+' ')+FILLN[T.f]+' '+noun+'.';
  const b=clamp(-2.1+1.5*sw,-1.9,2.2);
  const it=build({id:'M',cat:1,b,vis:true,prompt:'Which option completes the pattern?',
    stem:'<div class="mx" role="img" aria-label="3 by 3 pattern grid with the last cell missing">'+
      [0,1,2].map(r=>[0,1,2].map(c=>(r===2&&c===2)?'<div class="c q">?</div>':'<div class="c">'+cellSvg(cell(r,c))+'</div>').join('')).join('')+'</div>',
    right:cellSvg(T),wrong:wrong.map(cellSvg),explain:ex});
  return it;
}

/* rotation matrices (glyphs) */
function genGlyph(L){
  const hard=L>=.5, gl=shuffle(['flag','L','hook','arrow']);
  const steps=[0,1,2].map(()=>pick([45,90,135]));
  let cells=[],ans,glyph,ex,b;
  if(!hard){
    for(let r=0;r<3;r++)for(let c=0;c<3;c++)cells.push({g:gl[r],a:(c*steps[r])%360});
    glyph=gl[2];ans=(2*steps[2])%360;
    ex='Each row turns its shape the same amount at every step. Row 3 turns '+steps[2]+'° per step (clockwise), so the last shape is at '+ans+'°.';b=-.7+.6*L;
  }else{
    for(let r=0;r<3;r++)for(let c=0;c<3;c++)cells.push({g:gl[c],a:(r*steps[c])%360});
    glyph=gl[2];ans=(2*steps[2])%360;
    ex='Each column has its own shape, which turns '+steps[2]+'° clockwise on every step down. Column 3 ends at '+ans+'°.';b=.5+.5*L;
  }
  const angs=[ans];
  shuffle([45,-45,90,-90,180,135,-135]).forEach(d=>{const a=((ans+d)%360+360)%360;if(angs.length<5&&!angs.includes(a))angs.push(a);});
  const wrong=angs.slice(1).map(a=>glyphSvg(glyph,a,false));
  if(glyph!=='arrow')wrong.push(glyphSvg(glyph,ans,true));
  else{for(const d of [225,270,315,0]){const a=(ans+d)%360;if(!angs.includes(a)){wrong.push(glyphSvg(glyph,a,false));break;}}}
  return build({id:'G',cat:1,b,vis:true,prompt:'Which option completes the pattern?',
    stem:'<div class="mx" role="img" aria-label="3 by 3 rotation pattern">'+cells.map((x,i)=>i===8?'<div class="c q">?</div>':'<div class="c">'+glyphSvg(x.g,x.a,false)+'</div>').join('')+'</div>',
    right:glyphSvg(glyph,ans,false),wrong,explain:ex});
}

/* =====================  3. spatial rotation  ===================== */
function genPoly(n){
  for(let t=0;t<2000;t++){
    const cells=[[0,0]];
    while(cells.length<n){const [x,y]=pick(cells),d=pick([[1,0],[-1,0],[0,1],[0,-1]]),q=[x+d[0],y+d[1]];
      if(!cells.some(c=>c[0]===q[0]&&c[1]===q[1]))cells.push(q);}
    const cs=norm(cells),w=Math.max(...cs.map(p=>p[0]))+1,h=Math.max(...cs.map(p=>p[1]))+1;
    if(w>4||h>4)continue;
    if(!chiral(cs)||rotsym(cs))continue;
    return cs;
  }
  return norm([[1,0],[2,0],[0,1],[1,1],[1,2]]);
}
function genRot(n){
  const shape=genPoly(n),k=rint(1,3);
  const ans=rotN(shape,k),wrong=shuffle([0,1,2,3]).slice(0,3).map(j=>polySvg(rotN(mirror(shape),j)));
  return build({id:'R'+n,cat:5,b:-.7+.6*(n-4),vis:true,four:true,
    prompt:'Which option is the target shape turned around, not flipped over?',
    stem:'<div class="target" role="img" aria-label="Target shape">'+polySvg(norm(shape))+'</div>',
    right:polySvg(ans),wrong,
    explain:'Turning a shape never changes which way it is handed. Three options are mirror images of the target, so only one can be a pure turn.'});
}

/* =====================  5. working memory  ===================== */
/* The stimulus is shown for a few seconds, then hidden before the options appear. */
const DIG='123456789';
function seqVariants(seq,n){
  const out=new Set([seq.join('')]),res=[];
  for(let t=0;t<200&&res.length<n;t++){
    const v=seq.slice(),k=rnd(3);
    if(k===0){const i=rnd(v.length-1);[v[i],v[i+1]]=[v[i+1],v[i]];}
    else if(k===1){const free=DIG.split('').filter(d=>!v.includes(d));if(!free.length)continue;v[rnd(v.length)]=pick(free);}
    else{const i=rnd(v.length),j=rnd(v.length);if(Math.abs(i-j)<2)continue;[v[i],v[j]]=[v[j],v[i]];}
    const key=v.join('');if(!out.has(key)){out.add(key);res.push(v);}
  }
  return res;
}
const gridHtml=cells=>'<div class="memgrid">'+Array.from({length:16},(_,i)=>'<i'+(cells.includes(i)?' class="on"':'')+'></i>').join('')+'</div>';
function genMemory(L){
  const kind=pick(L<.35?['fwd','fwd','grid']:L<.7?['fwd','rev','grid']:['rev','rev','grid','fwd']);
  if(kind==='grid'){
    const k=Math.round(3+4*L),cells=shuffle([...Array(16).keys()]).slice(0,k).sort((a,b)=>a-b);
    const seen=new Set([cells.join()]),wrong=[];
    while(wrong.length<3){
      const v=cells.slice(),i=rnd(k);let c;do{c=rnd(16);}while(v.includes(c));v[i]=c;
      if(Math.random()<.4&&k>3){const j=(i+1)%k;let c2;do{c2=rnd(16);}while(v.includes(c2));v[j]=c2;}
      v.sort((a,b)=>a-b);const key=v.join();if(!seen.has(key)){seen.add(key);wrong.push(v);}
    }
    return Object.assign(build({id:'Mg',cat:6,b:clamp(-1.4+0.65*(k-3),-1.6,1.6),vis:true,four:true,
      prompt:'Which grid matches the pattern you just saw?',right:gridHtml(cells),wrong:wrong.map(gridHtml),
      explain:'The pattern had '+k+' squares filled. Spatial working memory: holding positions in mind briefly.'}),
      {mem:gridHtml(cells),memMs:1500+500*k,memPrompt:'Remember which squares are filled'});
  }
  const rev=kind==='rev',len=rev?Math.round(3+4*L):Math.round(4+4*L);
  const seq=shuffle(DIG.split('')).slice(0,len);
  const target=rev?seq.slice().reverse():seq;
  /* for backwards recall, the unreversed order is a natural distractor */
  const wrong=rev?[seq].concat(seqVariants(target,4).filter(v=>v.join('')!==seq.join('')).slice(0,2)):seqVariants(target,3);
  const fmtS=a=>a.join(' ');
  const b=rev?clamp(-1.0+0.7*(len-3),-1.2,1.9):clamp(-1.9+0.8*(len-4),-1.9,1.6);
  return Object.assign(build({id:'Ms',cat:6,b,
    prompt:rev?'Which is the sequence you saw, in reverse order?':'Which sequence did you see?',
    right:fmtS(target),wrong:wrong.map(fmtS),
    explain:'The sequence was '+fmtS(seq)+(rev?', so reversed it is '+fmtS(target):'')+'. Most adults can hold about 7 digits forwards and 5 backwards.'}),
    {seqOpt:true,mem:'<div class="mem">'+seq.join('')+'</div>',memMs:1000+800*len,memPrompt:rev?'Remember these digits. You will be asked for them backwards.':'Remember these digits in order'});
}

/* Every mode keeps the original pace of 20 seconds per question, so the scoring model's speed
   assumption holds; longer tests simply carry more questions and give a narrower range.
   mix = [series, matrices, verbal, quantitative, logic, spatial, working memory]. */
const MODES={
  5: {min:5, n:15,mix:[2,3,2,2,2,2,2],       name:'Quick'},
  10:{min:10,n:30,mix:[5,5,4,4,4,4,4],       name:'Standard'},
  30:{min:30,n:90,mix:[13,14,13,13,12,12,13],name:'Full'}
};
const CATS=['Number and letter series','Matrices','Verbal','Quantitative','Logic','Spatial rotation','Working memory'];
const lin=(n,a,b)=>Array.from({length:n},(_,i)=>n===1?a:a+(b-a)*i/(n-1));
function loadJSON(k,def){try{const v=JSON.parse(localStorage.getItem(k)||'null');return v==null?def:v;}catch(e){return def;}}
function saveJSON(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
let seenMem=[];
function buildTest(mode){
  const [nS,nM,nV,nQ,nL,nR,nW]=mode.mix;
  const seen=loadJSON('iq10-seen',seenMem);
  const series=lin(nS,0,.97).map(L=>genSeries(clamp(L+(Math.random()-.5)*.06,0,1)));
  /* roughly one in four matrices is a rotation matrix, as in the original 10 minute set */
  const mats=lin(nM,.03,1).map((L,i)=>(i%4===2)?genGlyph(L):genMatrix(clamp(L+(Math.random()-.5)*.06,0,1)));
  const written=pickBank('V',lin(nV,-1.7,1.6),seen).concat(pickBank('Q',lin(nQ,-1.7,1.2),seen),pickBank('L',lin(nL,-1.6,1.3),seen));
  const spat=lin(nR,4,8).map(v=>genRot(Math.round(v)));
  const mem=lin(nW,0,1).map(L=>genMemory(clamp(L+(Math.random()-.5)*.08,0,1)));
  const newSeen=seen.concat(written.map(v=>v.id)).slice(-80);
  seenMem=newSeen;saveJSON('iq10-seen',newSeen);
  return series.concat(mats,written,spat,mem).sort((a,b)=>a.b-b.b);
}

/* =====================  scoring  ===================== */
const DISC=1.25, PRIOR_SD=1.25, SPEED=0.25;
function estimate(items,flags){
  let den=0,m1=0,m2=0;
  for(let t=-4;t<=4.0001;t+=.05){
    let ll=-0.5*(t/PRIOR_SD)*(t/PRIOR_SD);
    for(let k=0;k<items.length;k++){
      const it=items[k],p=it.c+(1-it.c)/(1+Math.exp(-DISC*(t-it.b-SPEED)));
      ll+=Math.log(flags[k]?p:1-p);
    }
    const w=Math.exp(ll);den+=w;m1+=w*t;m2+=w*t*t;
  }
  const mean=m1/den,sd=Math.sqrt(Math.max(0,m2/den-mean*mean));
  return {iq:100+15*mean,sd:15*sd};
}
const phi=z=>{const t=1/(1+0.2316419*Math.abs(z)),d=0.3989423*Math.exp(-z*z/2);
  const p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p;};
const bandOf=q=>q>=130?'Very superior':q>=120?'Superior':q>=110?'High average':q>=90?'Average':q>=80?'Low average':q>=70?'Below average':'Well below average';

/* Turn plain-text maths into proper superscripts and subscripts wherever it appears on screen:
   e^(−x²) → e<sup>−x²</sup>, x^2 → x<sup>2</sup>, c_rms → c<sub>rms</sub>, k_B → k<sub>B</sub>. */
const MATH_RE=/\^[(\w−.-]|[A-Za-zΔΦαβγελμρστφωħ]_[(\w]/;
function fmtMath(t){
  t=t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return t
    .replace(/\^\(((?:[^()]|\([^()]*\))*)\)/g,'<sup>$1</sup>')
    .replace(/\^([−-]?[0-9.]*[0-9]|[A-Za-zα-ω]+)/g,'<sup>$1</sup>')
    .replace(/([A-Za-zΔΦαβγελμρστφωħ])_\(([^()]*)\)/g,'$1<sub>$2</sub>')
    .replace(/([A-Za-zΔΦαβγελμρστφωħ])_([A-Za-z0-9]+)/g,'$1<sub>$2</sub>');
}
function mathify(root){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{
    const p=n.parentNode&&n.parentNode.nodeName;
    return (p==='SCRIPT'||p==='STYLE'||p==='TEXTAREA'||p==='text'||!MATH_RE.test(n.data))?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;}});
  const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
  nodes.forEach(n=>{const s=document.createElement('span');s.innerHTML=fmtMath(n.data);n.replaceWith(...s.childNodes);});
}
new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1)mathify(n);else if(n.nodeType===3&&n.parentNode&&MATH_RE.test(n.data))mathify(n.parentNode);}))).observe(document.body,{childList:true,subtree:true});

   card('alphy','Physics','AQA')+card('almaths','Maths','Edexcel')+card('alecon','Economics','AQA')+card('alall','All subjects','Accuracy by topic')+
   card('hrp','Required practicals','All 12 AQA Physics practicals')+card('hvid','Video lessons',VIDEOS.length+' narrated lessons')+'</div></div>'+
  '<div class="hubsec"><p class="eyebrow">Daily training</p><div class="hubgrid">'+
   card('hdrill','Daily drill','10 quick questions',drDone?'✓ done today':(drillStreak(dr)?drillStreak(dr)+'-day streak':'Start a streak'),drDone)+
   card('hcards','Flashcards','AQA Physics definitions and facts',due?due+' due':'✓ all done',!due)+
   card('hmb','Review mistakes','Questions you got wrong',nmb?nmb+' to review':'',false)+
   card('htopics','Bridging topics','First-year ideas, made simple')+
   card('hres','Resources','Trusted free links')+'</div></div>'+
  '<div class="hubsec"><p class="eyebrow">Study tools</p><div class="hubgrid">'+
   card('hstudy','Study timer','Focus blocks, logged by subject',studyRun()?'running':'')+
   card('hprog','Progress','Everything in one place')+card('hbk','Backup','Save or restore your progress',loadJSON('backup-last',null)?'':'not backed up yet')+'</div></div>'+
  '<div class="hubsec"><p class="eyebrow">Intelligence</p>'+
   card('hiq','IQ test','Seven abilities · 5, 10 or 30 minutes')+'</div>'+
  '</div>';
  const go={hrp:rpHome,hvid:videosHome,hmb:mbHome,hbk:backupHome,alphy:()=>alSubject(0,home),almaths:()=>alSubject(1,home),alecon:()=>alSubject(2,home),alall:alHome,hiv:ivHome,hphy:phyHome,hpotw:potwHome,hdrill:drillHome,hcards:cardsHome,htopics:topicsHome,hres:resourcesHome,hstudy:studyHome,hprog:progressHome,hiq:iqHome};
  for(const id in go)document.getElementById(id).onclick=go[id];
  window.scrollTo(0,0);
}

function iqHome(){
  leave();
  const h=loadJSON('iq10-history',[]).slice(-5).reverse();
  app.innerHTML=
  '<div class="stack">'+
  '<div class="stack" style="gap:8px"><p class="eyebrow">Timed reasoning test</p><h1>IQ test</h1>'+
  '<p class="muted">Covers seven of the broad abilities in the standard model of intelligence used by modern IQ tests. Every attempt draws new questions. Longer tests give a narrower, more reliable estimate.</p></div>'+
  '<div class="modes">'+Object.values(MODES).map(m=>
    '<button class="mode" data-min="'+m.min+'"><b>'+m.min+'</b><span>minutes</span><span>'+m.n+' questions</span></button>').join('')+'</div>'+
  '<div class="kinds">'+
   '<div class="kind"><b>Series</b><span>Find the rule in numbers and letters</span></div>'+
   '<div class="kind"><b>Matrices</b><span>Complete the visual pattern</span></div>'+
   '<div class="kind"><b>Verbal</b><span>Vocabulary and analogies</span></div>'+
   '<div class="kind"><b>Quantitative</b><span>Reasoning with numbers</span></div>'+
   '<div class="kind"><b>Logic</b><span>Deduction and syllogisms</span></div>'+
   '<div class="kind"><b>Spatial rotation</b><span>Turn shapes in your head</span></div>'+
   '<div class="kind"><b>Working memory</b><span>Hold digits and patterns in mind</span></div>'+
  '</div>'+
  (h.length?'<div class="card stack"><h2>Recent results</h2>'+histHtml(h)+'</div>':'')+
  '<div class="card stack"><h2>About this test</h2>'+
   '<p class="note">Sections map onto the Cattell-Horn-Carroll (CHC) model behind tests such as the WAIS and Stanford-Binet: fluid reasoning (series, matrices, logic), crystallised knowledge (verbal), quantitative reasoning, visual-spatial ability and working memory. Questions are written or generated for this app rather than copied, because published banks are licensed or keep their answer keys private.</p>'+
   '<p class="note">The scoring model has not been calibrated on real test-takers, so read the result as a rough estimate with a wide margin, not a certified score.</p>'+
   '<p class="note">To keep this on your phone: open the page in Safari, tap Share, then Add to Home Screen. It then opens full screen like an app and works offline.</p></div>'+
  '<button class="btn ghost" id="hspeed">Processing speed check (60 s)</button>'+
  '<button class="btn ghost" id="hback">Home</button>'+
  '</div>';
  app.querySelectorAll('.mode').forEach(b=>b.onclick=()=>intro(MODES[b.dataset.min]));
  document.getElementById('hspeed').onclick=speedHome;
  document.getElementById('hback').onclick=home;
}

function intro(mode){
  setBack(iqHome);
  app.innerHTML=
  '<div class="stack">'+
  '<p class="eyebrow">'+mode.name+' · '+mode.n+' questions · '+mode.min+':00</p><h1>How it works</h1>'+
  '<div class="card"><ul class="rules">'+
   '<li>'+mode.n+' questions, '+mode.min+' minutes in total. Questions start easy and get harder, so most people will not finish.</li>'+
   '<li>Tap an answer to lock it in and move on. You cannot go back.</li>'+
   '<li>Skipped and unanswered questions count as wrong, so guess when unsure.</li>'+
   '<li>No calculator, notes or help. Sit somewhere quiet and do it in one go.</li>'+
  '</ul></div>'+
  '<button class="btn ghost" id="prac">Try two practice questions first</button>'+
  '<button class="btn" id="begin">Start the '+mode.min+' minutes</button>'+
  '<button class="btn ghost" id="back">Back</button>'+
  '</div>';
  document.getElementById('prac').onclick=()=>practice(0,[genSeries(.05),genMatrix(.05)],mode);
  document.getElementById('begin').onclick=()=>start(mode);
  document.getElementById('back').onclick=iqHome;
}

function optsHtml(it){
  const short=it.two&&!it.vis;
  const cls='opts'+(it.vis?(it.four?' vis four':' vis'):short?' two':'');
  return '<div class="'+cls+'">'+it.opts.map((o,k)=>
    '<button class="opt'+(it.vis?' vis':'')+(it.seqOpt?' seqo':'')+(short&&it.num?' num':'')+'" data-k="'+k+'" aria-label="Option '+LETTERS[k]+'">'+
    (it.vis?o.html+'<span class="k">'+LETTERS[k]+'</span>':'<span class="k">'+LETTERS[k]+'</span><span>'+o.html+'</span>')+'</button>').join('')+'</div>';
}

function practice(i,items,mode){
  if(i>=items.length)return intro(mode);
  setBack(()=>intro(mode));
  const it=items[i];
  app.innerHTML=
  '<div class="stack"><p class="eyebrow">Practice '+(i+1)+' of '+items.length+' · not timed, not scored</p>'+
  '<div class="card"><p class="prompt">'+it.prompt+'</p>'+it.stem+optsHtml(it)+'<div id="fb"></div></div></div>';
  const btns=[...app.querySelectorAll('.opt')];
  btns.forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k,ok=it.opts[k].ok;
    btns.forEach((x,j)=>{x.disabled=true;if(it.opts[j].ok)x.classList.add('right');});
    if(!ok)b.classList.add('wrong');
    document.getElementById('fb').innerHTML='<div class="fb"><b class="'+(ok?'ok':'no')+'">'+(ok?'Correct.':'Not quite.')+'</b><p class="note">'+it.explain+'</p><button class="btn" id="nx">'+(i+1<items.length?'Next practice':'Done')+'</button></div>';
    document.getElementById('nx').onclick=()=>practice(i+1,items,mode);
  });
}

function start(mode){
  S={mode,n:mode.n,limit:mode.min*60,i:0,start:Date.now(),
    items:buildTest(mode).map(it=>Object.assign({},it,{opts:shuffle(it.opts.slice())})),ans:new Array(mode.n).fill(null),done:false};
  setBack(()=>{if(confirm('Leave the test? This attempt will not be saved.'))iqHome();});
  render();
  clearInterval(tick);tick=setInterval(updateTimer,250);
}
function updateTimer(){
  if(!S||S.done)return;
  const left=S.limit-(Date.now()-S.start)/1000,el=document.getElementById('timer');
  if(el){el.textContent=fmt(left);el.classList.toggle('low',left<=60);}
  if(left<=0)finish(true);
}
function render(){
  const it=S.items[S.i],left=S.limit-(Date.now()-S.start)/1000;
  if(it.mem&&S.memShown!==S.i){
    S.memShown=S.i;const tok=S.i,until=Date.now()+it.memMs;
    app.innerHTML=
    '<div class="top"><span class="count">Q '+(S.i+1)+' / '+S.n+'</span><span class="timer'+(left<=60?' low':'')+'" id="timer">'+fmt(left)+'</span></div>'+
    '<div class="bar"><i style="width:'+(S.i/S.n*100)+'%"></i></div>'+
    '<div class="card"><div class="eyebrow" style="margin-bottom:8px">'+CATS[it.cat]+'</div>'+
     '<p class="prompt">'+it.memPrompt+'</p>'+it.mem+'<p class="memcount" id="memc"></p></div>';
    const cd=setInterval(()=>{const el=document.getElementById('memc');if(!S||S.done||S.i!==tok||!el){clearInterval(cd);return;}
      el.textContent='Hidden in '+Math.max(0,Math.ceil((until-Date.now())/1000))+' s';},100);
    setTimeout(()=>{clearInterval(cd);if(S&&!S.done&&S.i===tok)render();},it.memMs);
    window.scrollTo(0,0);
    return;
  }
  app.innerHTML=
  '<div class="top"><span class="count">Q '+(S.i+1)+' / '+S.n+'</span><span class="timer'+(left<=60?' low':'')+'" id="timer">'+fmt(left)+'</span></div>'+
  '<div class="bar"><i style="width:'+(S.i/S.n*100)+'%"></i></div>'+
  '<div class="card"><div class="eyebrow" style="margin-bottom:8px">'+CATS[it.cat]+'</div>'+
   '<p class="prompt">'+it.prompt+'</p>'+it.stem+optsHtml(it)+'</div>'+
  '<div class="skip"><button class="btn ghost small" id="quit">End test</button><button class="btn ghost small" id="skip">Skip</button></div>';
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  document.getElementById('skip').onclick=()=>answer(null);
  document.getElementById('quit').onclick=()=>{if(confirm('End the test now? Remaining questions count as wrong.'))finish(false);};
  window.scrollTo(0,0);
}
function answer(k){
  if(!S||S.done)return;
  S.ans[S.i]=k===null?null:S.items[S.i].opts[k].ok;
  (S.pick=S.pick||[])[S.i]=k;
  S.i++;
  if(S.i>=S.n)finish(false);else render();
}
document.addEventListener('keydown',e=>{
  if(!S||S.done)return;
  const n=+e.key,it=S.items[S.i];
  if(it&&n>=1&&n<=it.opts.length&&!e.metaKey&&!e.ctrlKey)answer(n-1);
});

function finish(timedOut){
  if(!S||S.done)return;
  S.done=true;clearInterval(tick);
  const used=Math.min(S.limit,(Date.now()-S.start)/1000);
  const flags=S.ans.map(a=>a===true);
  const e=estimate(S.items,flags);
  S.items.forEach((it,i)=>{if(S.ans[i]===false&&!it.mem){const k=(S.pick||[])[i];
    mbAdd({src:'IQ test · '+CATS[it.cat],prompt:it.prompt,stem:it.stem,right:it.opts.find(o=>o.ok).html,wrong:it.opts.filter(o=>!o.ok).map(o=>o.html),explain:it.explain});}});
  const iq=clamp(e.iq,55,145),lo=clamp(iq-1.645*e.sd,55,145),hi=clamp(iq+1.645*e.sd,55,145);
  const h=loadJSON('iq10-history',[]);
  h.push({t:Date.now(),min:S.mode.min,iq:Math.round(iq),lo:Math.round(lo),hi:Math.round(hi)});
  saveJSON('iq10-history',h.slice(-30));
  results({iq,lo,hi},used,timedOut,S,h.slice(-5).reverse());
}

function curveSvg(iq,lo,hi){
  const W=320,H=150,x0=14,x1=306,base=118,top=14,L=55,R=145;
  const X=v=>x0+(v-L)/(R-L)*(x1-x0),pdf=v=>Math.exp(-0.5*((v-100)/15)**2),Y=v=>base-pdf(v)*(base-top);
  let d='';for(let v=L;v<=R;v+=1)d+=(v===L?'M':'L')+X(v).toFixed(1)+' '+Y(v).toFixed(1);
  let a='M'+X(L)+' '+base;for(let v=L;v<=iq;v+=1)a+='L'+X(v).toFixed(1)+' '+Y(v).toFixed(1);a+='L'+X(iq).toFixed(1)+' '+base+'Z';
  let ticks='';[70,85,100,115,130].forEach(v=>{ticks+='<line class="axis" x1="'+X(v)+'" x2="'+X(v)+'" y1="'+base+'" y2="'+(base+4)+'"/><text x="'+X(v)+'" y="'+(base+16)+'" text-anchor="middle">'+v+'</text>';});
  return '<svg class="curve" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Bell curve with your estimate at '+Math.round(iq)+'">'+
   '<path class="area" d="'+a+'"/><path class="line" d="'+d+'"/><line class="axis" x1="'+x0+'" x2="'+x1+'" y1="'+base+'" y2="'+base+'"/>'+ticks+
   '<rect class="rng" x="'+X(lo)+'" y="'+(base-6)+'" width="'+(X(hi)-X(lo))+'" height="6" rx="3"/>'+
   '<line class="pin" x1="'+X(iq)+'" x2="'+X(iq)+'" y1="'+(Y(iq)-6)+'" y2="'+base+'"/><circle cx="'+X(iq)+'" cy="'+(Y(iq)-8)+'" r="4" fill="var(--accent)"/></svg>';
}

const ERRTXT={5:'around 10 to 15',10:'around 8 to 12',30:'around 5 to 8'};
function results(e,used,timedOut,st,hist){
  setBack(iqHome);
  const {iq,lo,hi}=e,{items,ans,n,mode}=st;
  const pct=clamp(phi((iq-100)/15)*100,.1,99.9),pctTxt=pct>=99?'99+':pct<1?'<1':String(Math.round(pct));
  const right=ans.filter(a=>a===true).length,attempted=ans.filter(a=>a!==null).length;
  const cats=CATS.map((nm,ci)=>{const idx=items.map((it,i)=>it.cat===ci?i:-1).filter(i=>i>=0);return {n:nm,tot:idx.length,ok:idx.filter(i=>ans[i]===true).length};});
  app.innerHTML=
  '<div class="stack">'+
  '<p class="eyebrow">'+(timedOut?'Time is up':'Finished')+' · '+mode.min+' minute test</p>'+
  '<div class="card hero"><span class="muted">Estimated IQ</span><span class="big">'+Math.round(iq)+'</span><span class="band">'+bandOf(iq)+'</span>'+
    '<p>Likely range <b>'+Math.round(lo)+' to '+Math.round(hi)+'</b> (90% confidence). Higher than about <b>'+pctTxt+'%</b> of people.</p>'+
    curveSvg(iq,lo,hi)+'<p class="note">The bar under the curve is your likely range. Scale: average 100, standard deviation 15.</p></div>'+
  '<div class="facts"><div class="fact"><b>'+right+' / '+n+'</b><span>correct</span></div><div class="fact"><b>'+attempted+'</b><span>answered</span></div><div class="fact"><b>'+fmt(used)+'</b><span>time used</span></div></div>'+
  '<div class="card stack"><h2>By question type</h2><div class="cats">'+
    cats.map(c=>'<div class="cr"><span class="n">'+c.n+'</span><span class="v">'+c.ok+' / '+c.tot+'</span><div class="t"><i style="width:'+(c.tot?c.ok/c.tot*100:0)+'%"></i></div></div>').join('')+'</div></div>'+
  (hist.length>1?'<div class="card stack"><h2>Recent results</h2>'+histHtml(hist)+'</div>':'')+
  '<div class="card stack"><h2>How to read this</h2>'+
    '<p class="note">'+n+' questions give a rough estimate. Expect the real error to be '+ERRTXT[mode.min]+' points either way, and more at the extremes. Scores above about 140 or below 70 cannot be told apart by a test like this.</p>'+
    '<p class="note">Mensa admits the top 2%, which is roughly 130 or above on this scale, using supervised tests. Tiredness, noise and a small screen all lower scores. Each attempt draws new questions, but practice still helps a little.</p></div>'+
  '<div class="card"><h2 style="margin-bottom:6px">Review answers</h2>'+
    items.map((it,i)=>{const r=ans[i];const m=r===true?['✓','ok']:r===false?['✗','no']:['–','sk'];
      const k=(st.pick||[])[i],right=it.opts.find(o=>o.ok).html,chosen=k==null?null:it.opts[k].html;
      return '<details class="rev"><summary><span class="mark '+m[1]+'">'+m[0]+'</span><span>Q'+(i+1)+' · '+CATS[it.cat]+'</span></summary>'+
        '<div class="rv"><p class="rq">'+it.prompt+'</p>'+(it.mem?'':it.stem)+'<div class="ra">'+(r===true?'':'<span class="lab">You</span><span class="no">'+(r===null?(i<st.i?'Skipped':'Not reached'):chosen)+'</span>')+
        '<span class="lab">Answer</span><span class="ok">'+right+'</span></div><p class="why">'+it.explain+'</p></div></details>';}).join('')+'</div>'+
  '<button class="btn" id="again">Take it again with new questions</button><button class="btn ghost" id="home">Back to IQ test</button>'+
  '</div>';
  document.getElementById('again').onclick=()=>start(mode);
  document.getElementById('home').onclick=iqHome;
  window.scrollTo(0,0);
}

home();
window.dispatchEvent(new Event('iq-started'));sessionStorage.removeItem('iq-repaired');
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js?v='+IQ_V);
</script>
